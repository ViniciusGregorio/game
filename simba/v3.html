document.addEventListener('keydown', e => {
  if (e.key === 'w' || e.key === 'ArrowUp') keys.up = true;
  if (e.key === 's' || e.key === 'ArrowDown') keys.down = true;
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowRight') keys.right = true;
  if (e.key === ' ') keys.space = true;
});

document.addEventListener('keyup', e => {
  if (e.key === 'w' || e.key === 'ArrowUp') keys.up = false;
  if (e.key === 's' || e.key === 'ArrowDown') keys.down = false;
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === ' ') keys.space = false;
});

function gameLoop() {
  // Voo vertical
  if(keys.up) fly(15);   // sobe rapidamente
  if(keys.down) fly(-15); // desce rapidamente
  // Movimento horizontal
  if(keys.left) move(-10);
  if(keys.right) move(10);
  // Tiro contínuo se desejar
  if(keys.space) shoot();

  requestAnimationFrame(gameLoop);
}

// Inicia o loop
gameLoop();

// Movimento horizontal
function move(val){simbaLeft+=val;if(simbaLeft<0) simbaLeft=0;if(simbaLeft>game.offsetWidth-50) simbaLeft=game.offsetWidth-50;simba.style.left=simbaLeft+'px';}

// Voo vertical rápido
function fly(val){simbaBottom+=val;if(simbaBottom<0) simbaBottom=0;if(simbaBottom>game.offsetHeight-50) simbaBottom=game.offsetHeight-50;simba.style.bottom=simbaBottom+'px';}

 let canShoot = true;       // controla disparo
const shootDelay = 200;    // delay em ms entre tiros

function shoot(){
  if(!canShoot) return;     // não dispara se ainda não passou o cooldown
  canShoot = false;
  
  const bullet=document.createElement('div'); 
  bullet.classList.add('entity'); 
  bullet.textContent='⚡';
  bullet.style.left=simbaLeft+50+'px'; 
  bullet.style.bottom=simbaBottom+20+'px';
  game.appendChild(bullet); 
  bullets.push(bullet);
  
  let intv=setInterval(()=>{
    let left=parseInt(bullet.style.left);
    if(left>game.offsetWidth){ clearInterval(intv); game.removeChild(bullet); bullets=bullets.filter(b=>b!==bullet);}
    else{ bullet.style.left=(left+15)+'px'; checkBulletCollision(bullet,intv);}
  },20);
  
  // ✅ Habilita o próximo tiro depois do delay
  setTimeout(()=>{canShoot = true;}, shootDelay);
}

// Spawn entidades
function spawnEntity(){
  const e=document.createElement('div'); e.classList.add('entity');
  let type=Math.random()<0.5?'obstacle':'treasure'; e.dataset.type=type;
  e.style.left=game.offsetWidth+'px'; e.style.bottom=(50+Math.random()*200)+'px';
  if(type==='obstacle') e.textContent=['🌵','🦖','🛰️'][Math.floor(Math.random()*3)];
  else e.textContent=treasures[Math.floor(Math.random()*treasures.length)];
  game.appendChild(e);
  let speed=3+Math.random()*2;
  let moveInt=setInterval(()=>{
    let left=parseInt(e.style.left);
    if(left<-50){ clearInterval(moveInt); game.removeChild(e);}
    else { e.style.left=(left-speed)+'px'; detectProximity(e); checkCollision(e,moveInt);}
  },20);
}

// Sensor de proximidade
function detectProximity(entity){
  let simbaRect=simba.getBoundingClientRect(), entRect=entity.getBoundingClientRect();
  let dx=Math.abs((simbaRect.left+simbaRect.right)/2-(entRect.left+entRect.right)/2);
  if(dx<100) entity.style.filter='brightness(1.5)'; else entity.style.filter='brightness(1)';
}

// Colisão Simba-entidade
function checkCollision(entity,intv){
  let simbaRect=simba.getBoundingClientRect(), entRect=entity.getBoundingClientRect();
  if(!(simbaRect.right<entRect.left || simbaRect.left>entRect.right || simbaRect.bottom<entRect.top || simbaRect.top>entRect.bottom)){
    if(entity.dataset.type==='obstacle') showPopup('💥 Cuidado!');
    else { score++; showPopup('🎉 Tesouro: '+entity.textContent);}
    scoreboard.textContent='Score: '+score;
    clearInterval(intv); game.removeChild(entity);
  }
}

// Colisão tiro-entidade
function checkBulletCollision(bullet,intv){
  const entities=document.querySelectorAll('.entity');
  entities.forEach(e=>{
    if(e.dataset.type && e!==bullet){
      let bRect=bullet.getBoundingClientRect(), eRect=e.getBoundingClientRect();
      if(!(bRect.right<eRect.left || bRect.left>eRect.right || bRect.bottom<eRect.top || bRect.top>eRect.bottom)){
        if(e.dataset.type==='obstacle') showPopup('💥 Obstáculo destruído!');
        else { score++; showPopup('🎯 Tesouro coletado!');}
        scoreboard.textContent='Score: '+score;
        clearInterval(intv); game.removeChild(bullet); bullets=bullets.filter(b=>b!==bullet);
        if(e.parentNode) game.removeChild(e);
      }
    }
  });
}

// Pop-ups leves
function showPopup(text){
  const p=document.createElement('div'); p.classList.add('popup');
  p.style.left=(50+Math.random()*200)+'px'; p.style.bottom=(100+Math.random()*150)+'px'; p.textContent=text;
  game.appendChild(p); setTimeout(()=>game.removeChild(p),1500);
}
