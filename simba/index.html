// Controles
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowUp') jump();
  if(e.key === 'ArrowLeft') moveLeft();
  if(e.key === 'ArrowRight') moveRight();
  if(e.key === 'ArrowDown') slide();
});

// Funções de movimento
function jump() {
  if(isJumping) return;
  isJumping = true;
  let jumpHeight = 150;
  let upInterval = setInterval(() => {
    if(simbaBottom >= 50 + jumpHeight) {
      clearInterval(upInterval);
      let downInterval = setInterval(() => {
        if(simbaBottom <= 50) {
          clearInterval(downInterval);
          isJumping = false;
        } else {
          simbaBottom -= 10;
          simba.style.bottom = simbaBottom + 'px';
        }
      }, 20);
    } else {
      simbaBottom += 10;
      simba.style.bottom = simbaBottom + 'px';
    }
    simba.style.bottom = simbaBottom + 'px';
  }, 20);
}
function moveLeft() {
  simbaLeft -= 20;
  if(simbaLeft < 0) simbaLeft = 0;
  simba.style.left = simbaLeft + 'px';
}
function moveRight() {
  simbaLeft += 20;
  if(simbaLeft > game.offsetWidth - 50) simbaLeft = game.offsetWidth - 50;
  simba.style.left = simbaLeft + 'px';
}
function slide() {
  // efeito visual de deslizar
  simba.style.bottom = simbaBottom - 30 + 'px';
  setTimeout(()=>simba.style.bottom = simbaBottom+'px', 300);
}

// Função spawn de entidades (obstáculos e tesouros)
function spawnEntity() {
  const entity = document.createElement('div');
  entity.classList.add('entity');
  let type = Math.random()<0.5?'obstacle':'treasure';
  entity.dataset.type = type;
  entity.style.left = game.offsetWidth + 'px';
  entity.style.bottom = (50 + Math.random()*200) + 'px';
  if(type==='obstacle') entity.textContent = ['🌵','🦖','🛰️'][Math.floor(Math.random()*3)];
  else entity.textContent = treasures[Math.floor(Math.random()*treasures.length)];
  game.appendChild(entity);
  
  let speed = 5 + Math.random()*3;
  let move = setInterval(()=>{
    let left = parseInt(entity.style.left);
    if(left < -50) { clearInterval(move); game.removeChild(entity);}
    else {
      entity.style.left = (left-speed)+'px';
      // Colisão
      let simbaRect = simba.getBoundingClientRect();
      let entRect = entity.getBoundingClientRect();
      if(!(simbaRect.right < entRect.left || simbaRect.left > entRect.right ||
           simbaRect.bottom < entRect.top || simbaRect.top > entRect.bottom)) {
        if(type==='obstacle') showPopup('💥 Opa! Obstáculo maluco!');
        else {
          score++;
          showPopup('🎉 Tesouro aprendido: '+entity.textContent);
        }
        scoreboard.textContent = 'Score: '+score;
        clearInterval(move);
        game.removeChild(entity);
      }
    }
  },20);
}

// Pop-ups
function showPopup(text) {
  const popup = document.createElement('div');
  popup.classList.add('popup');
  popup.style.left = (50 + Math.random()*200) + 'px';
  popup.style.bottom = (100 + Math.random()*200) + 'px';
  popup.textContent = text;
  game.appendChild(popup);
  setTimeout(()=>game.removeChild(popup),2000);
}

// Loop de spawn
setInterval(spawnEntity, 1000);

// Fundo animado de galáxias e partículas
setInterval(()=>{
  const star = document.createElement('div');
  star.textContent = '🌌';
  star.classList.add('entity');
  star.style.left = game.offsetWidth+'px';
  star.style.bottom = Math.random()*game.offsetHeight+'px';
  star.style.fontSize = (10+Math.random()*20)+'px';
  game.appendChild(star);
  let move = setInterval(()=>{
    let left = parseInt(star.style.left);
    if(left < -50){ clearInterval(move); game.removeChild(star);}
    else star.style.left = (left-2)+'px';
  },30);
},500);
