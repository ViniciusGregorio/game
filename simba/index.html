#menu button,#gameover button{padding:15px 30px;margin:10px;font-size:24px;cursor:pointer;border-radius:10px;border:none;background:#ffcc00;color:black;font-weight:bold;}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(to top,#00111a,#220033);display:none;}
#simba{position:absolute;bottom:50px;left:50px;font-size:50px;transition:bottom 0.03s,left 0.03s;}
.entity{position:absolute;font-size:40px;transition:filter 0.1s;}
.popup{position:absolute;background:rgba(0,0,0,0.7);color:#fff;padding:5px 10px;border-radius:5px;font-size:16px;animation:fadeOut 1.5s forwards;}
@keyframes fadeOut{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-40px);}}
#scoreboard{position:absolute;top:10px;left:10px;font-size:24px;}

const powerups=["💨","🛡️","🔮","💡"];

// Controle de teclas
const keys={up:false,down:false,left:false,right:false,space:false};

// Controle de cooldown
let canShoot=true,shootDelay=200;

document.addEventListener('keydown',e=>{
  if(e.key==='w'||e.key==='ArrowUp') keys.up=true;
  if(e.key==='s'||e.key==='ArrowDown') keys.down=true;
  if(e.key==='ArrowLeft') keys.left=true;
  if(e.key==='ArrowRight') keys.right=true;
  if(e.key===' ') keys.space=true;
});
document.addEventListener('keyup',e=>{
  if(e.key==='w'||e.key==='ArrowUp') keys.up=false;
  if(e.key==='s'||e.key==='ArrowDown') keys.down=false;
  if(e.key==='ArrowLeft') keys.left=false;
  if(e.key==='ArrowRight') keys.right=false;
  if(e.key===' ') keys.space=false;
});

// Funções de movimento
function move(val){simbaLeft+=val;if(simbaLeft<0) simbaLeft=0;if(simbaLeft>game.offsetWidth-50) simbaLeft=game.offsetWidth-50;simba.style.left=simbaLeft+'px';}
function fly(val){simbaBottom+=val;if(simbaBottom<0) simbaBottom=0;if(simbaBottom>game.offsetHeight-50) simbaBottom=game.offsetHeight-50;simba.style.bottom=simbaBottom+'px';}

// Função de tiro
function shoot(){
  if(!canShoot || !gameRunning) return;
  canShoot=false;
  const bullet=document.createElement('div');
  bullet.classList.add('entity'); bullet.textContent='⚡';
  bullet.style.left=simbaLeft+50+'px'; bullet.style.bottom=simbaBottom+20+'px';
  game.appendChild(bullet); bullets.push(bullet);

  let intv=setInterval(()=>{
    let left=parseInt(bullet.style.left);
    if(left>game.offsetWidth){ clearInterval(intv); game.removeChild(bullet); bullets=bullets.filter(b=>b!==bullet);}
    else{ bullet.style.left=(left+15)+'px'; checkBulletCollision(bullet,intv);}
  },20);

  setTimeout(()=>{canShoot=true;},shootDelay);
}

// Spawn de entidades
function spawnEntity(){
  if(!gameRunning) return;
  const e=document.createElement('div'); e.classList.add('entity');
  let type=Math.random()<0.6?'obstacle':'treasure'; 
  e.dataset.type=type;
  e.style.left=game.offsetWidth+'px'; e.style.bottom=(50+Math.random()*200)+'px';
  if(type==='obstacle') e.textContent=['🌵','🦖','☄️','🛰️'][Math.floor(Math.random()*4)];
  else {
    e.textContent=Math.random()<0.3?powerups[Math.floor(Math.random()*powerups.length)]:treasures[Math.floor(Math.random()*treasures.length)];
  }
  game.appendChild(e); entities.push(e);

  let speed=3+Math.random()*2;
  let moveInt=setInterval(()=>{
    if(!gameRunning){clearInterval(moveInt); return;}
    let left=parseInt(e.style.left);
    if(left<-50){ clearInterval(moveInt); game.removeChild(e); entities=entities.filter(en=>en!==e);}
    else { e.style.left=(left-speed)+'px'; detectProximity(e); checkCollision(e,moveInt);}
  },20); intervals.push(moveInt);
}

// Sensores de proximidade
function detectProximity(entity){
  let simbaRect=simba.getBoundingClientRect(), entRect=entity.getBoundingClientRect();
  let dx=Math.abs((simbaRect.left+simbaRect.right)/2-(entRect.left+entRect.right)/2);
  if(dx<100) entity.style.filter='brightness(1.5)'; else entity.style.filter='brightness(1)';
}

// Colisões
function checkCollision(entity,intv){
  let simbaRect=simba.getBoundingClientRect(), entRect=entity.getBoundingClientRect();
  if(!(simbaRect.right<entRect.left || simbaRect.left>entRect.right || simbaRect.bottom<entRect.top || simbaRect.top>entRect.bottom)){
    if(entity.dataset.type==='obstacle') showPopup('💥 Cuidado!');
    else if(powerups.includes(entity.textContent)) activatePowerup(entity.textContent);
    else { score++; showPopup('🎉 Tesouro: '+entity.textContent); maybeMiniQuiz(); }
    scoreboard.textContent='Score: '+score;
    clearInterval(intv); game.removeChild(entity); entities=entities.filter(en=>en!==entity);
  }
}

// Colisão tiro
function checkBulletCollision(bullet,intv){
  entities.forEach(e=>{
    if(e.dataset.type && e!==bullet){
      let bRect=bullet.getBoundingClientRect(), eRect=e.getBoundingClientRect();
      if(!(bRect.right<eRect.left || bRect.left>eRect.right || bRect.bottom<eRect.top || bRect.top>eRect.bottom)){
        if(e.dataset.type==='obstacle') showPopup('💥 Obstáculo destruído!');
        else if(powerups.includes(e.textContent)) activatePowerup(e.textContent);
        else { score++; showPopup('🎯 Tesouro coletado!'); maybeMiniQuiz(); }
        scoreboard.textContent='Score: '+score;
        clearInterval(intv); game.removeChild(bullet); bullets=bullets.filter(b=>b!==bullet);
        if(e.parentNode) game.removeChild(e); entities=entities.filter(en=>en!==e);
      }
    }
  });
}

// Popups
function showPopup(text){
  const p=document.createElement('div'); p.classList.add('popup');
  p.style.left=(50+Math.random()*200)+'px'; p.style.bottom=(100+Math.random()*150)+'px'; p.textContent=text;
  game.appendChild(p); setTimeout(()=>game.removeChild(p),1500);
}

// Mini-quizzes
function maybeMiniQuiz(){
  if(Math.random()<0.2){
    const ans=prompt("Mini-quiz! Qual nome do pai de Sansão?");
    if(ans=="Manoah"){score+=2; showPopup('✔ Correto! +2 pontos'); scoreboard.textContent='Score: '+score;}
    else showPopup('❌ Dica: 2+2 = 4');
  }
}

// Powerups
function activatePowerup(p){
  if(p==='💨'){ showPopup('🚀 Turbo Ativado!'); turboMode(5000);}
  if(p==='🛡️'){ showPopup('🛡️ Escudo Ativado!'); shieldMode(5000);}
  if(p==='🔮'){ showPopup('✨ Pontos x2!'); doubleScoreMode(5000);}
  if(p==='💡'){ showPopup('💡 Dica de estudo!'); }
}

function turboMode(ms){ let speedBoost=15; let origFly=fly; fly=(val)=>{origFly(val*2);} ; setTimeout(()=>{fly=(val)=>{simbaBottom+=val;if(simbaBottom<0) simbaBottom=0;if(simbaBottom>game.offsetHeight-50) simbaBottom=game.offsetHeight-50;simba.style.bottom=simbaBottom+'px';}},ms);}
function shieldMode(ms){ /* Proteção de obstáculos: pode implementar efeito visual */ setTimeout(()=>{},ms);}
function doubleScoreMode(ms){ let origCheck=checkCollision; checkCollision=(entity,intv)=>{origCheck(entity,intv); score*=2; scoreboard.textContent='Score: '+score;}; setTimeout(()=>{checkCollision=origCheck;},ms);}

// Loop principal
function gameLoop(){
  if(!gameRunning) return;
  if(keys.up) fly(15);
  if(keys.down) fly(-15);
  if(keys.left) move(-10);
  if(keys.right) move(10);
  if(keys.space) shoot();
  requestAnimationFrame(gameLoop);
}

// Fundo galáxias
function spawnGalaxies(){
  if(!gameRunning) return;
  const star=document.createElement('div');
  star.textContent=['🌌','☄️','✨'][Math.floor(Math.random()*3)];
  star.classList.add('entity');
  star.style.left=game.offsetWidth+'px';
  star.style.bottom=Math.random()*game.offsetHeight+'px';
  star.style.fontSize=(10+Math.random()*20)+'px';
  game.appendChild(star);
  let move=setInterval(()=>{
    let left=parseInt(star.style.left);
    if(left<-50){ clearInterval(move); game.removeChild(star);}
    else star.style.left=(left-1)+'px';
  },30); intervals.push(move);
}

// Iniciar Jogo
startBtn.onclick = ()=>{
  menu.style.display='none';
  game.style.display='block';
  gameRunning=true;
  score=0; scoreboard.textContent='Score: 0';
  simbaBottom=50; simbaLeft=50; simba.style.bottom='50px'; simba.style.left='50px';
  // Spawn
  intervals.push(setInterval(spawnEntity,1200));
  intervals.push(setInterval(spawnGalaxies,600));
  gameLoop();
}

// Encerrar Jogo
exitBtn.onclick = endGame;
function endGame(){
  gameRunning=false;
  game.style.display='none';
  menu.style.display='none';
  gameover.style.display='flex';
  finalScore.textContent='Sua pontuação: '+score;
  intervals.forEach(i=>clearInterval(i));
  bullets.forEach(b=>{if(b.parentNode) game.removeChild(b);});
  entities.forEach(e=>{if(e.parentNode) game.removeChild(e);});
  bullets=[]; entities=[]; intervals=[];
}

// Reiniciar
restartBtn.onclick = ()=>{
  gameover.style.display='none';
  menu.style.display='block';
}
</script>
